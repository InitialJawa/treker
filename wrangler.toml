name = "treker"
main = "worker/index.ts"
compatibility_date = "2024-01-01"

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "Iteneradb"
database_id = "df0f2ce4-aea5-4e4a-bf3d-9c03d379c4e9"

# Optional Cloudflare KV Binding (Uncomment dan ganti id jika membuat KV namespace)
# [[kv_namespaces]]
# binding = "CACHE_KV"
# id = "your-kv-namespace-id-here"

[vars]
ENVIRONMENT = "production"
ENABLE_CORS = "true"

# Single Page Application assets configuration for Pages / Workers
[site]
bucket = "./dist"
